name: Build and Deploy

on:
  push:
    branches:
    - main
  schedule:
  - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - id: date
      run: echo "::set-output name=today::$(date +'%Y-%m-%d')"
    - run: npm ci
    - run: npm link
    - run: betor-catalog -b ${{ vars.BETOR_API_URL }} -a ${{ secrets.BETOR_API_AUTHORIZATION }} data-fetch-items
    - env:
        DATA_DOMAIN: ${{ vars.SURGE_DATA_DOMAIN }}
      run: betor-catalog --exclude-dead-torrents data-catalog-items
    - env:
        DATA_DOMAIN: ${{ vars.SURGE_DATA_DOMAIN }}
      run: betor-catalog build
    - run: mkdir -p deploy/site deploy/data
    - run: cp -R dist/. deploy/site/
    - run: rm -rf deploy/site/static/data
    - run: cp src/_data/*.json deploy/data
    - run: npm install surge
    - run: npx surge deploy/site ${{ vars.SURGE_DOMAIN }} --token ${{ secrets.SURGE_TOKEN }}
    - run: npx surge deploy/data ${{ vars.SURGE_DATA_DOMAIN }} --token ${{ secrets.SURGE_TOKEN }}
    - uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  purge-cache:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
    - uses: jakejarvis/cloudflare-purge-action@master
      env:
        CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
        CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
